[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "videobench-workbench"
version = "0.1.0"
description = "Evidence-first evaluation instruments for agentic professional video editing"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [{ name = "Steven Zimmerman", email = "15812269+EffortlessSteven@users.noreply.github.com" }]
keywords = ["benchmark", "video-editing", "davinci-resolve", "agents", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "rich>=13.9,<16",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6",
  "mypy>=1.14",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "types-PyYAML>=6.0",
]

[project.scripts]
videobench = "videobench.cli:app"

[project.urls]
Homepage = "https://github.com/EffortlessMetrics/VideoBench"
Repository = "https://github.com/EffortlessMetrics/VideoBench"
Issues = "https://github.com/EffortlessMetrics/VideoBench/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/videobench"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["videobench"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["videobench"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["videobench"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true
