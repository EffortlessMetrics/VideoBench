name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Install locked environment
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: |
          test -f uv.lock
          uv lock --check
          uv sync --locked --extra dev
      - name: Verify
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv run --locked --no-sync python scripts/check.py
