name: Format implementation branch

on:
  push:
    branches: [work/mcp-capability-surface]

permissions:
  contents: write

jobs:
  format:
    if: "${{ github.event.head_commit.message != 'style: apply Ruff format' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/mcp-capability-surface
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Ruff
        run: python -m pip install 'ruff==0.16.10'
      - name: Format
        run: python -m ruff format .
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo 'Already formatted.'
            exit 0
          fi
          git config user.name 'EffortlessSteven'
          git config user.email '15812269+EffortlessSteven@users.noreply.github.com'
          git add -A
          git commit -m 'style: apply Ruff format'
          git push origin HEAD:work/mcp-capability-surface
