name: Export source snapshot

on:
  push:
    branches:
      - work/provider-adapter

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/upload-artifact@v4
        with:
          name: videobench-source-${{ github.sha }}
          path: .
          include-hidden-files: true
          retention-days: 1
