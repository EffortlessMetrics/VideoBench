name: Harden provider live contract

on:
  push:
    branches: [work/provider-adapter]

permissions:
  contents: write

jobs:
  harden:
    if: "${{ github.event.head_commit.message == 'chore: execute provider contract hardening' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/provider-adapter
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Apply provider contract hardening
        run: python .github/scripts/harden_provider_live_contract.py

      - name: Install development toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Regenerate contracts and normalize source
        run: |
          set -euo pipefail
          videobench export-schemas --out contracts/schemas
          python -m ruff check --fix --unsafe-fixes . || true
          python -m ruff format .
          python -m ruff check .
          git config user.name 'EffortlessSteven'
          git config user.email '15812269+EffortlessSteven@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden provider live API contract'

      - name: Verify complete repository gate
        run: |
          set -o pipefail
          if ! python scripts/check.py 2>&1 | tee /tmp/check.log; then
            cp /tmp/check.log VERIFICATION_FAILURE.txt
            git add -A
            git commit -m 'chore: capture provider contract verification failure'
            git push origin HEAD:work/provider-adapter
            exit 1
          fi

      - name: Publish verified branch
        run: git push origin HEAD:work/provider-adapter
