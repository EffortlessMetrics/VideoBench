name: Prepare Astral migration (one-shot)

on:
  push:
    branches: [modernize/astral-20261021]
    paths:
      - .github/workflows/prepare-astral-migration.yml

permissions: {}

jobs:
  prepare:
    if: github.repository == 'EffortlessMetrics/VideoBench'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      UV_PYTHON: '3.11.16'
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.13.4'
          enable-cache: false
      - name: Generate lock and qualify proposed source
        run: |
          python3 .github/maintenance/repair_astral.py
          python3 .github/maintenance/prepare_astral.py
      - name: Preserve actual results, including failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: astral-migration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/astral-migration/
          if-no-files-found: error
          retention-days: 7

  retain-candidate:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: astral-migration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/astral-input
      - name: Validate and stage only the qualified patch
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/astral-input
        run: |
          python3 - <<'PY'
          import ast, hashlib, json, os, subprocess
          from pathlib import Path, PurePosixPath
          root = Path(os.environ['ARTIFACT_ROOT'])
          receipt = json.loads((root / 'receipt.json').read_text())
          patch = (root / 'candidate.patch').read_bytes()
          assert receipt['qualified'] is True
          assert receipt['input_head'] == os.environ['GITHUB_SHA']
          assert 0 < len(patch) <= 16 * 1024 * 1024
          assert hashlib.sha256(patch).hexdigest() == receipt['patch_sha256']
          subprocess.run(['git', 'apply', '--index', '--whitespace=error', str(root / 'candidate.patch')], check=True)
          allowed = {'pyproject.toml', 'uv.lock', 'scripts/check.py', '.github/workflows/ci.yml', '.pre-commit-config.yaml', 'AGENTS.md', 'CONTRIBUTING.md', 'README.md', 'src/videobench/runner.py', 'src/videobench/verifier.py', 'src/videobench/judge.py', 'tests/test_judge.py', 'tests/test_enum_rendering.py'}
          removed = {'.github/workflows/prepare-astral-migration.yml', '.github/maintenance/prepare_astral.py', '.github/maintenance/repair_astral.py'}
          names = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')[:-1]
          assert names and 'uv.lock' in names
          for name in names:
              path = PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              if name in removed:
                  assert not Path(name).exists()
                  continue
              assert Path(name).is_file() and not Path(name).is_symlink()
              modes = subprocess.check_output(['git', 'ls-files', '-s', '--', name]).decode()
              assert modes.startswith(('100644 ', '100755 '))
              if name in allowed:
                  continue
              assert path.parts[0] in {'src', 'tests', 'scripts'} and path.suffix == '.py', name
              before = subprocess.check_output(['git', 'show', f'HEAD:{name}']).decode()
              after = Path(name).read_text()
              assert ast.dump(ast.parse(before), include_attributes=False) == ast.dump(ast.parse(after), include_attributes=False), name
          assert removed.issubset(names)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          PY
      - name: Retain qualified non-workflow source without broadening token authority
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=modernize/astral-20261021
          gh auth setup-git
          observed=$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)
          test "$observed" = "$EXPECTED_HEAD"
          git restore --staged --worktree --source=HEAD -- \
            .github/workflows/ci.yml \
            .github/workflows/prepare-astral-migration.yml
          git diff --cached --check
          test -f uv.lock
          test ! -e .github/maintenance/prepare_astral.py
          test ! -e .github/maintenance/repair_astral.py
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git commit -m 'build(python): adopt locked Astral environment and required ty checks'
          git push origin "HEAD:refs/heads/$branch"
