name: Export provider review source

on:
  push:
    branches: [scratch/provider-review-export]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-artifact@v7
        with:
          name: provider-review-source
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
