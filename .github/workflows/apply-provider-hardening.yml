name: Apply provider hardening patch

on:
  push:
    branches:
      - work/provider-adapter

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: apply provider hardening patch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified patch and remove bootstrap material
        env:
          EXPECTED_GZIP_SHA256: a53c5d4a221735692e727f6ff5c51fcce42ac8f08722477f2dc86d10e09a6e22
          EXPECTED_GZIP_BYTES: '23266'
          EXPECTED_TREE: 8e20b4a4701ba2099572b74f9072e56573818c63
        run: |
          set -euo pipefail
          base64 --decode .videobench-bootstrap/provider-hardening.patch.gz.b64 > /tmp/provider-hardening.patch.gz
          test "$(stat -c %s /tmp/provider-hardening.patch.gz)" = "$EXPECTED_GZIP_BYTES"
          echo "$EXPECTED_GZIP_SHA256  /tmp/provider-hardening.patch.gz" | sha256sum -c -
          gzip --decompress --stdout /tmp/provider-hardening.patch.gz > /tmp/provider-hardening.patch
          git apply --check /tmp/provider-hardening.patch
          git apply --index /tmp/provider-hardening.patch
          git rm -r .videobench-bootstrap
          git rm .github/workflows/apply-provider-hardening.yml
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git commit -m 'fix: enforce provider evidence and transport integrity'
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git push origin HEAD:work/provider-adapter
