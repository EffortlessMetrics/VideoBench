name: Finalize provider adapter verification

on:
  push:
    branches: [work/provider-adapter]

permissions:
  contents: write

jobs:
  finalize:
    if: "${{ github.event.head_commit.message == 'chore: finalize provider adapter verification' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/provider-adapter
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install development toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Finalize source tree
        run: |
          set -euo pipefail
          rm -f VERIFICATION_FAILURE.txt .github/workflows/finalize-provider-adapter.yml
          python -m ruff check --fix --unsafe-fixes . || true
          python -m ruff format .
          python -m ruff check .
          git config user.name 'EffortlessSteven'
          git config user.email '15812269+EffortlessSteven@users.noreply.github.com'
          git add -A
          git commit -m 'style: finalize provider adapter verification'

      - name: Verify complete repository gate
        run: |
          set -o pipefail
          if ! python scripts/check.py 2>&1 | tee /tmp/check.log; then
            cp /tmp/check.log VERIFICATION_FAILURE.txt
            git add -A
            git commit -m 'chore: capture provider adapter verification failure'
            git push origin HEAD:work/provider-adapter
            exit 1
          fi

      - name: Publish verified branch
        run: git push origin HEAD:work/provider-adapter
