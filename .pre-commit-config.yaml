repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff (locked environment)
        entry: uv run --locked --no-sync ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format (locked environment)
        entry: uv run --locked --no-sync ruff format
        language: system
        types_or: [python, pyi]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=1024]
